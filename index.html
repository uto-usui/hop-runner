<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Hop Runner — ジャンプだけのオートランナー</title>
    <meta
      name="description"
      content="ジャンプだけのオートランナー。タイミングと長押しで障害物を跳び越え、すれすれ（ニアミス）を攻めてコンボ倍率を伸ばし、走った距離とスコアを競う。"
    />
    <meta name="theme-color" content="#11151c" />
    <link rel="canonical" href="https://uto-usui.github.io/hop-runner/" />

    <!-- アイコン（/ 始まりは Vite が base=/hop-runner/ を前置する） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph（クローラは解決できないので絶対 URL を直書き） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hop Runner" />
    <meta property="og:title" content="Hop Runner — ジャンプだけのオートランナー" />
    <meta
      property="og:description"
      content="タイミングと長押しで障害物を跳び越え、すれすれを攻めてコンボを稼ぐ。走った距離とスコアを競うワンボタンのオートランナー。"
    />
    <meta property="og:url" content="https://uto-usui.github.io/hop-runner/" />
    <meta property="og:image" content="https://uto-usui.github.io/hop-runner/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="夕暮れのコースを跳び越える Hop Runner のプレイ画面" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X カード -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hop Runner — ジャンプだけのオートランナー" />
    <meta
      name="twitter:description"
      content="タイミングと長押しで障害物を跳び越え、すれすれを攻めてコンボを稼ぐ。走った距離とスコアを競うワンボタンのオートランナー。"
    />
    <meta name="twitter:image" content="https://uto-usui.github.io/hop-runner/og.png" />
    <meta name="twitter:image:alt" content="夕暮れのコースを跳び越える Hop Runner のプレイ画面" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <p class="hint">SPACE / タップ でジャンプ ・ H で調整パネル</p>
      <button id="lang" class="lang" type="button" data-no-jump>EN</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
