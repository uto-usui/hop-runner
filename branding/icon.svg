<?xml version="1.0" encoding="UTF-8"?>
<!-- Hop Runner アプリアイコンの元データ（フルブリード正方形）。
     apple-touch-icon / maskable アイコン用に角丸を付けず、要素は中央セーフゾーンに収める。
     配色はゲームの夕暮れシーン（src/theme.ts SCENES[2]）から。青キャラがオレンジに映える。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3b6e"/>
      <stop offset="0.55" stop-color="#9c5f6e"/>
      <stop offset="1" stop-color="#f3a26b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7c2"/>
      <stop offset="0.6" stop-color="#ffcf94"/>
      <stop offset="1" stop-color="#ffcf94" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 空 -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- 夕日 -->
  <circle cx="360" cy="300" r="150" fill="url(#sun)"/>

  <!-- 遠景の丘（シルエット） -->
  <path d="M0 372 Q 130 322 270 360 T 512 350 V512 H0 Z" fill="#6e5a86" opacity="0.55"/>
  <path d="M0 400 Q 160 360 320 392 T 512 388 V512 H0 Z" fill="#8a5f72" opacity="0.7"/>

  <!-- 地面 -->
  <rect x="0" y="416" width="512" height="96" fill="#5c4a54"/>
  <rect x="0" y="416" width="512" height="6" fill="#3a2f38"/>

  <!-- 障害物 -->
  <rect x="330" y="356" width="46" height="60" rx="4" fill="#e8a13a"/>

  <!-- ホップ弧 -->
  <path d="M150 416 Q 256 150 376 356" fill="none" stroke="#fbeede" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="4 22" opacity="0.65"/>

  <!-- 収集オーブ -->
  <circle cx="392" cy="196" r="44" fill="url(#orbGlow)"/>
  <circle cx="392" cy="196" r="20" fill="#f5c518"/>
  <circle cx="385" cy="189" r="7" fill="#fff8e0"/>

  <!-- プレイヤー（青い角丸キャラ＋右向きの目）。跳躍の頂点で大きく中央に。 -->
  <g>
    <rect x="176" y="150" width="118" height="152" rx="26" fill="#3a6df0"/>
    <ellipse cx="262" cy="196" rx="15" ry="17" fill="#ffffff"/>
    <circle cx="265" cy="198" r="6.5" fill="#1b2b54"/>
  </g>
</svg>
